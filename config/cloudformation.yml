AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Deploy the www.lizanddustin.com static site to the existing S3 bucket.
Parameters:
  DeploymentContentVersion:
    Type: String
    Description: Any unique string identifying the files being deployed. The deploy script passes the packaged CodeUri (an S3 URI that changes whenever the content changes).
  WebsiteBucketName:
    Type: String
    Default: www.lizanddustin.com
    Description: Name of the existing S3 bucket serving the site. Override to alpha.lizanddustin.com for a staging deploy (see scripts/deploy).

Resources:
  # Deployment
  S3UploadLambdaLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      ContentUri: ../node_modules/s3-upload-custom-resource-lambda-layer/dist/layer.zip
  S3UploadLambda:
    Type: AWS::Serverless::Function
    Properties:
      Layers: [!Ref S3UploadLambdaLayer]
      CodeUri: ../dist
      Handler: s3-upload-custom-resource.handler
      MemorySize: 10240
      Timeout: 180
      Runtime: nodejs24.x
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref WebsiteBucketName
  DeployWebsite:
    Type: Custom::UploadFilesToS3
    Properties:
      ServiceToken: !GetAtt S3UploadLambda.Arn
      BucketName: !Ref WebsiteBucketName
      ContentVersion: !Ref DeploymentContentVersion

  WebsiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    Properties:
      BucketName: www.lizanddustin.com
      WebsiteConfiguration:
        IndexDocument: index.html
  WebsiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    DeletionPolicy: Retain
    Properties:
      Bucket: !Ref WebsiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Id: AllowPublicAccess
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "arn:aws:s3:::${WebsiteBucket}/*"
  ApexBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    Properties:
      BucketName: lizanddustin.com
      WebsiteConfiguration:
        RedirectAllRequestsTo:
          HostName: www.lizanddustin.com
          Protocol: https
  ApexBucketPolicy:
    Type: AWS::S3::BucketPolicy
    DeletionPolicy: Retain
    Properties:
      Bucket: !Ref ApexBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: StaticWebsiteAccess
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "arn:aws:s3:::${ApexBucket}/*"
  SiteCertificate:
    Type: AWS::CertificateManager::Certificate
    DeletionPolicy: Retain
    Properties:
      DomainName: lizanddustin.com
      SubjectAlternativeNames:
        - '*.lizanddustin.com'
      ValidationMethod: DNS

  WwwDistribution:
    Type: AWS::CloudFront::Distribution
    DeletionPolicy: Retain
    Properties:
      DistributionConfig:
        Aliases:
          - www.lizanddustin.com
        DefaultCacheBehavior:
          Compress: true
          TargetOriginId: S3-lizanddustin.com
          ViewerProtocolPolicy: redirect-to-https
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
        Enabled: true
        IPV6Enabled: false
        Origins:
          - Id: S3-lizanddustin.com
            DomainName: www.lizanddustin.com.s3-website-us-east-1.amazonaws.com
            CustomOriginConfig:
              OriginProtocolPolicy: http-only
              OriginSSLProtocols:
                - TLSv1
                - TLSv1.1
                - TLSv1.2
        PriceClass: PriceClass_100
        ViewerCertificate:
          AcmCertificateArn: !Ref SiteCertificate
          MinimumProtocolVersion: TLSv1.1_2016
          SslSupportMethod: sni-only
  ApexDistribution:
    Type: AWS::CloudFront::Distribution
    DeletionPolicy: Retain
    Properties:
      DistributionConfig:
        Aliases:
          - lizanddustin.com
        DefaultCacheBehavior:
          Compress: true
          TargetOriginId: Custom-lizanddustin.com.s3-website-us-east-1.amazonaws.com
          ViewerProtocolPolicy: redirect-to-https
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
        Enabled: true
        IPV6Enabled: false
        Origins:
          - Id: Custom-lizanddustin.com.s3-website-us-east-1.amazonaws.com
            DomainName: lizanddustin.com.s3-website-us-east-1.amazonaws.com
            CustomOriginConfig:
              OriginProtocolPolicy: http-only
              OriginSSLProtocols:
                - TLSv1
                - TLSv1.1
                - TLSv1.2
        PriceClass: PriceClass_100
        ViewerCertificate:
          AcmCertificateArn: !Ref SiteCertificate
          MinimumProtocolVersion: TLSv1.1_2016
          SslSupportMethod: sni-only

Outputs:
  WebsiteBucket:
    Description: The existing bucket the site is deployed to.
    Value: !Ref WebsiteBucketName
  S3UploadLambdaArn:
    Description: The upload Lambda backing the DeployWebsite custom resource.
    Value: !GetAtt S3UploadLambda.Arn
